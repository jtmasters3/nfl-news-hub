name: Refresh NFL news
# $0 cost, no secrets required — the refresh pipeline is fully deterministic
# (RSS/sitemap parsing + rule-based clustering/categorization, no AI calls).

on:
  # GitHub's native schedule: trigger was removed here. It was empirically
  # unreliable in this repo — the Actions API run history showed only 3
  # scheduled firings in a 2-hour window (one gap of 45 minutes) even with
  # two staggered cron entries, which isn't enough to hold a 30-minute
  # freshness requirement. An external scheduler (cron-job.org) now calls
  # this workflow's dispatch endpoint every 10 minutes instead:
  #   POST /repos/jtmasters3/nfl-news-hub/actions/workflows/refresh.yml/dispatches
  # workflow_dispatch is what makes that possible — required, not optional.
  workflow_dispatch: {}

permissions:
  contents: write

# Both schedules (and any manual run) share this single group, so GitHub
# queues a second trigger rather than running two refreshes in parallel —
# this is what actually prevents the two staggered schedules from racing
# each other or corrupting files, on top of the push-retry logic below.
concurrency:
  group: refresh-nfl-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - run: npm run refresh

      - name: Commit and push (status.json every run; other files only if changed)
        run: |
          git config user.name "nfl-news-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Refresh NFL news feed"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — pulling latest main and retrying."
            git pull --rebase origin main
          done
          echo "Failed to push after 3 attempts." >&2
          exit 1
