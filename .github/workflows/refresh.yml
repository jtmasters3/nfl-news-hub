name: Refresh NFL news
# $0 cost, no secrets required — the refresh pipeline is fully deterministic
# (RSS/sitemap parsing + rule-based clustering/categorization, no AI calls).

on:
  schedule:
    # Every 10 minutes. GitHub Actions cron is best-effort and can run late
    # under load — 10 min builds in real margin against the project's
    # 30-minute freshness requirement rather than sitting right at the edge
    # of it. Public repos get unlimited free Actions minutes, and each run
    # takes ~15-20s, so this costs nothing.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-nfl-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - run: npm run refresh

      - name: Commit updated feed (only if something changed)
        run: |
          git config user.name "nfl-news-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json data/processed-articles.json index.html feed.xml
          git diff --quiet --cached || git commit -m "Refresh NFL news feed"
          git push
